[project]
name = "devops-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
description = "Lambda that investigates CloudWatch alarms with a read-only Bedrock tool loop and records findings"
dependencies = [
    "boto3>=1.40.0,<2.0.0",
    "aws-lambda-powertools>=3.24.0,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "cryptography>=46.0.0,<47.0.0",
    # zoneinfo data for scheduled_jobs; the Lambda image may not ship /usr/share/zoneinfo.
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SVG markup strings.
"docs/diagram/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=devops_agent --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: marks unit tests",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true
