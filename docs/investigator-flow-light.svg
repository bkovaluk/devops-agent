<svg xmlns="http://www.w3.org/2000/svg" width="1638" height="430" viewBox="0 0 1638 430" role="img" aria-label="Investigator"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a8"/></marker></defs><rect width="1638" height="430" rx="18" fill="#f7f8fb"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111524" text-anchor="start">Investigator</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4f5a70" text-anchor="start">Runs one investigation: read-only checks until the model reports, then a redacted, stored finding.</text><rect x="44.0" y="194.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="57" y="209" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="57" y="217" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="57" y="225" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="70" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Work queue</text><rect x="156.0" y="194.0" width="52" height="52" rx="10" fill="#DD344C"/><path d="M182,207 L193,212 L193,221 C193,228 187,232 182,234 C177,232 171,228 171,221 L171,212 Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M178,220 L181,224 L187,216" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="182" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Session</text><text x="182" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">own or member role</text><rect x="268.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="330.0" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Recall</text><text x="330.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">past reviewed findings</text><rect x="452.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="514.0" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Precheck</text><text x="514.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">context, no model</text><rect x="586.0" y="120" width="342.0" height="230" rx="14" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="602.0" y="111" width="86" height="18" rx="4" fill="#f7f8fb"/><text x="610.0" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">MODEL LOOP</text><rect x="636.0" y="194.0" width="52" height="52" rx="10" fill="#01A88D"/><polygon points="662.0,207 673.31,213.5 673.31,226.5 662.0,233 650.69,226.5 650.69,213.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="662.0" cy="220" r="4" fill="#fff"/><text x="662.0" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Reason</text><text x="662.0" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">hypotheses first</text><rect x="748.0" y="194.0" width="52" height="52" rx="10" fill="#DD344C"/><path d="M774.0,207 L785.0,212 L785.0,221 C785.0,228 779.0,232 774.0,234 C769.0,232 763.0,228 763.0,221 L763.0,212 Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M770.0,220 L773.0,224 L779.0,216" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="774.0" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Read</text><text x="774.0" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">read-only tools</text><polygon points="887.0,193 914.0,220 887.0,247 860.0,220" fill="#eef1f7" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/><text x="887.0" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">?</text><text x="887.0" y="181" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Reported?</text><path d="M887,255 L887,308 Q887,318 877,318 L606,318 Q596,318 596,308 L596,248 Q596,238 606,238 L628,238" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M887,247 L887,308 Q887,318 877,318 L606,318 Q596,318 596,308 L596,248 Q596,238 606,238 L636,238" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><text x="741.5" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">not yet</text><rect x="974.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="1036.0" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Redact</text><text x="1036.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">credentials removed</text><rect x="1158.0" y="194.0" width="52" height="52" rx="10" fill="#C925D1"/><ellipse cx="1184.0" cy="211" rx="12" ry="4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1172.0,211 L1172.0,229 A12,4.5 0 0 0 1196.0,229 L1196.0,211 M1172.0,220 A12,4.5 0 0 0 1196.0,220" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1184.0" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Store</text><text x="1184.0" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">findings table</text><rect x="1270.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="1332.0" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Remember</text><text x="1332.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">when reported</text><rect x="1454.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1516.0" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Notify</text><text x="1516.0" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">optional</text><path d="M104,220 L148,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M96,220 L156,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M216,220 L260,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M208,220 L268,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M400,220 L444,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M392,220 L452,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M584,220 L628,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M576,220 L636,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M696,220 L740,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M688,220 L748,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M808,220 L852,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M800,220 L860,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M922,220 L966,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M914,220 L974,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1106,220 L1150,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M1098,220 L1158,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1218,220 L1262,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M1210,220 L1270,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1402,220 L1446,220" stroke="#f7f8fb" stroke-width="6" fill="none"/><path d="M1394,220 L1454,220" stroke="#8a94a8" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><text x="951.0" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">done</text><text x="32" y="412" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a8499" text-anchor="start">The loop runs until the model reports or gives up; a run without a report is still stored, as incomplete. With member accounts, the session is that account&#x27;s read-only role, for this job only.</text></svg>
