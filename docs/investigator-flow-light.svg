<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="430" viewBox="0 0 1520 430" role="img" aria-label="Investigator"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a8"/></marker></defs><rect width="1520" height="430" rx="18" fill="#f7f8fb"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111524" text-anchor="start">Investigator</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4f5a70" text-anchor="start">Runs one investigation: read-only checks until the model reports, then a redacted, stored finding.</text><rect x="44.0" y="194.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="57" y="209" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="57" y="217" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="57" y="225" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="70" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Work queue</text><rect x="159.0" y="194.0" width="52" height="52" rx="10" fill="#DD344C"/><path d="M185,207 L196,212 L196,221 C196,228 190,232 185,234 C180,232 174,228 174,221 L174,212 Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M181,220 L184,224 L190,216" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Session</text><text x="185" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">own or member role</text><path d="M96,220 L159,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="263.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="325" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Recall</text><text x="325" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">past reviewed findings</text><rect x="403.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="465" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Precheck</text><text x="465" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">context, no model</text><path d="M211,220 L263.0,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M387.0,220 L403.0,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="535" y="120" width="390" height="230" rx="14" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="551" y="111" width="86" height="18" rx="4" fill="#f7f8fb"/><text x="559" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2563eb" text-anchor="start">MODEL LOOP</text><rect x="599.0" y="194.0" width="52" height="52" rx="10" fill="#01A88D"/><polygon points="625,207 636.31,213.5 636.31,226.5 625,233 613.69,226.5 613.69,213.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="625" cy="220" r="4" fill="#fff"/><text x="625" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Reason</text><text x="625" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">hypotheses first</text><rect x="724.0" y="194.0" width="52" height="52" rx="10" fill="#DD344C"/><path d="M750,207 L761,212 L761,221 C761,228 755,232 750,234 C745,232 739,228 739,221 L739,212 Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M746,220 L749,224 L755,216" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Read</text><text x="750" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">read-only tools</text><polygon points="870,193 897,220 870,247 843,220" fill="#eef1f7" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/><text x="870" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">?</text><text x="870" y="181" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Reported?</text><path d="M527.0,220 L599,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M651,220 L724,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M776,220 L843,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M870,247 L870,318 L553,318 L553,220 L599,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="735" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">not yet</text><rect x="933.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="995" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Redact</text><text x="995" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">credentials removed</text><rect x="1104.0" y="194.0" width="52" height="52" rx="10" fill="#C925D1"/><ellipse cx="1130" cy="211" rx="12" ry="4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1118,211 L1118,229 A12,4.5 0 0 0 1142,229 L1142,211 M1118,220 A12,4.5 0 0 0 1142,220" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1130" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#111524" text-anchor="middle">Store</text><text x="1130" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#7a8499" text-anchor="middle">findings table</text><rect x="1198.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3"/><text x="1260" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Remember</text><text x="1260" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">when reported</text><rect x="1333.0" y="191.0" width="124" height="58" rx="12" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1395" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#111524" text-anchor="middle">Notify</text><text x="1395" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">optional</text><path d="M897,220 L933.0,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="915" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#4f5a70" text-anchor="middle">done</text><path d="M1057.0,220 L1104,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1156,220 L1198.0,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1322.0,220 L1333.0,220" stroke="#8a94a8" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="32" y="412" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7a8499" text-anchor="start">The loop runs until the model reports or gives up; a run without a report is still stored, as incomplete. Limits make the model report from what it has; a fallback model covers outages. With member accounts, the session is that account&#x27;s read-only role, for this job only.</text></svg>
