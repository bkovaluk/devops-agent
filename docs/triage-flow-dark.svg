<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-label="Triage"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7894"/></marker></defs><rect width="1400" height="500" rx="18" fill="#0b0e18"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6ecf6" text-anchor="start">Triage</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93a0b8" text-anchor="start">Decides, without a model, which signals earn an investigation. Every decision is recorded.</text><rect x="44.0" y="184.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="57" y="199" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="57" y="207" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="57" y="215" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="70" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Alarms queue</text><rect x="143.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="205" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Parse</text><text x="205" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">signals, deduped</text><rect x="283.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="345" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Settle</text><text x="345" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">keys and severity</text><path d="M96,210 L143.0,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M267.0,210 L283.0,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M345,239 L345,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="309.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="345" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">dropped</text><text x="345" y="368" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#66728a" text-anchor="middle">unverified, stale or refused</text><rect x="420" y="120" width="690" height="290" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="436" y="111" width="142" height="18" rx="4" fill="#0b0e18"/><text x="444" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="start">GATES  ·  no model</text><path d="M407.0,210 L453,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><polygon points="480,183 507,210 480,237 453,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="480" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="480" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Opted out?</text><path d="M480,237 L480,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="444.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="480" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">skipped</text><path d="M507,210 L583,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><polygon points="610,183 637,210 610,237 583,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="610" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="610" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Open or cooling down?</text><path d="M610,237 L610,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="578.2" y="327" width="63.599999999999994" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="610" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">repeat</text><path d="M637,210 L713,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><polygon points="740,183 767,210 740,237 713,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="740" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="740" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Shares a key?</text><path d="M740,237 L740,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="708.2" y="327" width="63.599999999999994" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="740" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">linked</text><path d="M767,210 L843,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><polygon points="870,183 897,210 870,237 843,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="870" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="870" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Part of a storm?</text><path d="M870,237 L870,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="834.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="870" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">grouped</text><path d="M897,210 L973,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><polygon points="1000,183 1027,210 1000,237 973,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="1000" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="1000" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Over budget?</text><path d="M1000,237 L1000,327" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="925.3" y="327" width="149.39999999999998" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="1000" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">deferred or skipped</text><text x="765" y="390" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#66728a" text-anchor="middle">each exit is recorded on a finding</text><rect x="1128.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="1190" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Emit</text><text x="1190" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">claim keys, send</text><rect x="1299.0" y="184.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="1312" y="199" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="1312" y="207" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="1312" y="215" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="1325" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Work queue</text><path d="M1027,210 L1128.0,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1252.0,210 L1299,210" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="32" y="482" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66728a" text-anchor="start">Right: the signal moves on. Down: it leaves there. A storm&#x27;s head and urgent signals go on; the rest are grouped. Deferred signals return to the alarms queue while still in ALARM.</text></svg>
