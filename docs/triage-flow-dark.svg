<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="500" viewBox="0 0 1390 500" role="img" aria-label="Triage"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7894"/></marker></defs><rect width="1390" height="500" rx="18" fill="#0b0e18"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6ecf6" text-anchor="start">Triage</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93a0b8" text-anchor="start">Decides, without a model, which signals earn an investigation. Every decision is recorded.</text><rect x="44.0" y="184.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="57" y="199" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="57" y="207" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="57" y="215" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="70" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Alarms queue</text><rect x="156.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="218.0" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Parse</text><text x="218.0" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">signals, deduped</text><rect x="340.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="402.0" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Settle</text><text x="402.0" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">keys and severity</text><path d="M402,247 L402,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M402,239 L402,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="366.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="402.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">dropped</text><text x="402.0" y="368" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#66728a" text-anchor="middle">unverified, stale or refused</text><rect x="480.0" y="120" width="606.0" height="290" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="496.0" y="111" width="142" height="18" rx="4" fill="#0b0e18"/><text x="504.0" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="start">GATES  ·  no model</text><polygon points="551.0,183 578.0,210 551.0,237 524.0,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="551.0" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="551.0" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Opted out?</text><path d="M551,245 L551,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M551,237 L551,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="515.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="551.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">skipped</text><polygon points="665.0,183 692.0,210 665.0,237 638.0,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="665.0" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="665.0" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Open or cooling?</text><path d="M665,245 L665,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M665,237 L665,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="633.2" y="327" width="63.599999999999994" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="665.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">repeat</text><polygon points="779.0,183 806.0,210 779.0,237 752.0,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="779.0" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="779.0" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Shares a key?</text><path d="M779,245 L779,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M779,237 L779,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="747.2" y="327" width="63.599999999999994" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="779.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">linked</text><polygon points="893.0,183 920.0,210 893.0,237 866.0,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="893.0" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="893.0" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">In a storm?</text><path d="M893,245 L893,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M893,237 L893,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="857.9" y="327" width="70.19999999999999" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="893.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">grouped</text><polygon points="1007.0,183 1034.0,210 1007.0,237 980.0,210" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="1007.0" y="215" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="1007.0" y="171" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Over budget?</text><path d="M1007,245 L1007,319" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M1007,237 L1007,327" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="932.3" y="327" width="149.39999999999998" height="26" rx="13" fill="#C925D1" opacity="0.92"/><text x="1007.0" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">deferred or skipped</text><text x="783.0" y="390" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#66728a" text-anchor="middle">each exit is recorded on a finding</text><rect x="1094.0" y="181.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="1156.0" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Emit</text><text x="1156.0" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">claim keys, send</text><rect x="1278.0" y="184.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="1291.0" y="199" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="1291.0" y="207" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="1291.0" y="215" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="1304.0" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Work queue</text><path d="M104,210 L148,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M96,210 L156,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M288,210 L332,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M280,210 L340,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M472,210 L516,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M464,210 L524,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M586,210 L630,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M578,210 L638,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M700,210 L744,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M692,210 L752,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M814,210 L858,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M806,210 L866,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M928,210 L972,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M920,210 L980,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1042,210 L1086,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M1034,210 L1094,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1226,210 L1270,210" stroke="#0b0e18" stroke-width="6" fill="none"/><path d="M1218,210 L1278,210" stroke="#6b7894" stroke-width="1.6" fill="none" stroke-linejoin="round" marker-end="url(#ah)"/><text x="32" y="482" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66728a" text-anchor="start">Right: the signal moves on. Down: it leaves there. A storm&#x27;s head and urgent signals go on; the rest are grouped. Deferred signals return to the alarms queue while still in ALARM.</text></svg>
