<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="990" viewBox="0 0 1100 990" role="img" aria-label="Triage"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7894"/></marker></defs><rect width="1100" height="990" rx="18" fill="#0b0e18"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6ecf6" text-anchor="start">Triage</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93a0b8" text-anchor="start">Decides, without a model, which signals earn an investigation. Every other signal still gets a finding.</text><rect x="226.2" y="114" width="347.6" height="28" rx="14" fill="#E7157B" opacity="0.92"/><text x="400.0" y="132.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Alarms queue  ·  batches of up to 25 within 60 s</text><path d="M400,142 L400,187" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="187.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">1</text><text x="202.0" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Parse</text><text x="202.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">signals by detail-type; drop non-ALARM and excluded names; dedupe</text><path d="M400,245 L400,275" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="275.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">2</text><text x="202.0" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Settle</text><text x="202.0" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">resource keys from the metric, consumer Lambdas, Severity tag</text><path d="M400,333 L400,371" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="371" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="396.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">Tagged DevOpsAgent=off?</text><path d="M640.0,392 L686.0,392" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="662.0" y="385" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">yes</text><rect x="690.0" y="378" width="126.5" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="753.25" y="396.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">skipped finding</text><path d="M400,413 L400,459" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="440.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">no</text><rect x="160.0" y="459" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="484.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">Already open, or closed within the cooldown?</text><path d="M640.0,480 L686.0,480" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="662.0" y="473" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">yes</text><rect x="690.0" y="466" width="180.1" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="780.05" y="484.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">repeat: one more firing</text><path d="M400,501 L400,547" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="528.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">no</text><rect x="160.0" y="547" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="572.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">A running job or earlier signal shares a key?</text><path d="M640.0,568 L686.0,568" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="662.0" y="561" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">yes</text><rect x="690.0" y="554" width="119.8" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="749.9" y="572.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">linked finding</text><path d="M400,589 L400,635" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="616.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">no</text><rect x="160.0" y="635" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="660.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">Alarm storm, or 5+ jobs left in the batch?</text><path d="M640.0,656 L686.0,656" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="662.0" y="649" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">yes</text><rect x="690.0" y="642" width="280.6" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="830.3" y="660.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">the rest grouped onto one incident job</text><path d="M400,677 L400,723" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="704.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">no, or the incident job</text><rect x="160.0" y="723" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="748.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">Within the budget for its priority?</text><path d="M640.0,744 L686.0,744" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="662.0" y="737" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">no</text><rect x="690.0" y="730" width="273.9" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="826.95" y="748.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">P1/P2 deferred 15 min · P3/P4 skipped</text><path d="M400,765 L400,803" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="788.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">yes</text><rect x="160.0" y="803.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">3</text><text x="202.0" y="828" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Emit</text><text x="202.0" y="846" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">claim the resource keys, count the budgets, send the job</text><path d="M400,861 L400,906" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="353.5" y="906" width="93.0" height="28" rx="14" fill="#E7157B" opacity="0.92"/><text x="400.0" y="924.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Work queue</text><text x="32" y="972" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66728a" text-anchor="start">Every decision writes one CloudWatch metric and one log line. A deferred signal goes back to the alarms queue while it stays in ALARM.</text></svg>
