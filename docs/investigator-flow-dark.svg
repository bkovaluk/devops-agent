<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-label="Investigator"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7894"/></marker></defs><rect width="1400" height="430" rx="18" fill="#0b0e18"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6ecf6" text-anchor="start">Investigator</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93a0b8" text-anchor="start">Runs one investigation: read-only checks until the model reports, then a redacted, stored finding.</text><rect x="44.0" y="194.0" width="52" height="52" rx="10" fill="#E7157B"/><rect x="57" y="209" width="26" height="5" rx="2" fill="#fff" opacity="1.0"/><rect x="57" y="217" width="26" height="5" rx="2" fill="#fff" opacity="0.75"/><rect x="57" y="225" width="26" height="5" rx="2" fill="#fff" opacity="0.5"/><text x="70" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Work queue</text><rect x="138.0" y="191.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="200" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Recall</text><text x="200" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">past reviewed findings</text><rect x="278.0" y="191.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="340" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Precheck</text><text x="340" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">context, no model</text><path d="M96,220 L138.0,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M262.0,220 L278.0,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="410" y="120" width="390" height="230" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="426" y="111" width="86" height="18" rx="4" fill="#0b0e18"/><text x="434" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#3b82f6" text-anchor="start">MODEL LOOP</text><rect x="474.0" y="194.0" width="52" height="52" rx="10" fill="#01A88D"/><polygon points="500,207 511.31,213.5 511.31,226.5 500,233 488.69,226.5 488.69,213.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="220" r="4" fill="#fff"/><text x="500" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Reason</text><text x="500" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#66728a" text-anchor="middle">hypotheses first</text><rect x="599.0" y="194.0" width="52" height="52" rx="10" fill="#DD344C"/><path d="M625,207 L636,212 L636,221 C636,228 630,232 625,234 C620,232 614,228 614,221 L614,212 Z" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M621,220 L624,224 L630,216" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Read</text><text x="625" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#66728a" text-anchor="middle">read-only tools</text><polygon points="745,193 772,220 745,247 718,220" fill="#10162a" stroke="#3b82f6" stroke-width="1.5" stroke-linejoin="round"/><text x="745" y="225" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6" text-anchor="middle">?</text><text x="745" y="181" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Reported?</text><path d="M402.0,220 L474,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M526,220 L599,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M651,220 L718,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M745,247 L745,318 L428,318 L428,220 L474,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="610" y="311" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">not yet</text><rect x="808.0" y="191.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="870" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Redact</text><text x="870" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">credentials removed</text><rect x="979.0" y="194.0" width="52" height="52" rx="10" fill="#C925D1"/><ellipse cx="1005" cy="211" rx="12" ry="4.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M993,211 L993,229 A12,4.5 0 0 0 1017,229 L1017,211 M993,220 A12,4.5 0 0 0 1017,220" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1005" y="265.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#e6ecf6" text-anchor="middle">Store</text><text x="1005" y="281.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#66728a" text-anchor="middle">findings table</text><rect x="1073.0" y="191.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3"/><text x="1135" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Remember</text><text x="1135" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">when reported</text><rect x="1208.0" y="191.0" width="124" height="58" rx="12" fill="#121827" stroke="#2c3550" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1270" y="217" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#e6ecf6" text-anchor="middle">Notify</text><text x="1270" y="235" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">optional</text><path d="M772,220 L808.0,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="790" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="middle">done</text><path d="M932.0,220 L979,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1031,220 L1073.0,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><path d="M1197.0,220 L1208.0,220" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="32" y="412" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66728a" text-anchor="start">The loop runs until the model reports or gives up; a run without a report is still stored, as incomplete. Limits make the model report from what it has; a fallback model covers outages.</text></svg>
