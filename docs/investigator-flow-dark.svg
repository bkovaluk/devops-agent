<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1078" viewBox="0 0 1100 1078" role="img" aria-label="Investigator"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7894"/></marker></defs><rect width="1100" height="1078" rx="18" fill="#0b0e18"/><text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6ecf6" text-anchor="start">Investigator</text><text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#93a0b8" text-anchor="start">Runs one investigation: read-only checks until the model reports, then a stored, redacted finding.</text><rect x="222.85" y="114" width="354.3" height="28" rx="14" fill="#E7157B" opacity="0.92"/><text x="400.0" y="132.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Work queue  ·  one job per run, at most 2 at once</text><path d="M400,142 L400,187" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="187.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">1</text><text x="202.0" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Recall</text><text x="202.0" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">up to 3 reviewed findings on the same resource</text><path d="M400,245 L400,275" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="275.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">2</text><text x="202.0" y="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Precheck</text><text x="202.0" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">code, no model: the context bundle for this alarm</text><path d="M400,333 L400,363" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="363.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">3</text><text x="202.0" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Reason</text><text x="202.0" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">Bedrock Converse: hypotheses first, then pick a check</text><path d="M400,421 L400,451" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="451.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="476" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">4</text><text x="202.0" y="476" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Read</text><text x="202.0" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">read-only tools: AWS through the guard, Datadog, GitHub</text><path d="M400,509 L400,547" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="547" width="480" height="42" rx="21" fill="#10162a" stroke="#3b82f6" stroke-width="1.3"/><text x="400" y="572.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf6" text-anchor="middle">Called report_finding?</text><path d="M160.0,568 L114.0,568 L114.0,392 L160.0,392" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="108.0" y="480.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="end">no, next step</text><path d="M400,589 L400,627" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><text x="408" y="612.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">yes</text><rect x="160.0" y="627.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="652" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">5</text><text x="202.0" y="652" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Redact</text><text x="202.0" y="670" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">credential shapes removed from every string field</text><path d="M400,685 L400,715" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="715.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="740" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">6</text><text x="202.0" y="740" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Store</text><text x="202.0" y="758" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">the finding in DynamoDB, with its evidence trail</text><path d="M400,773 L400,803" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="803.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="828" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">7</text><text x="202.0" y="828" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Notify</text><text x="202.0" y="846" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">optional: critical and high findings to the SNS topic</text><path d="M400,861 L400,891" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="160.0" y="891.0" width="480" height="58" rx="10" fill="#121827" stroke="#2c3550" stroke-width="1.2"/><text x="178.0" y="916" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#66728a" text-anchor="start">8</text><text x="202.0" y="916" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#e6ecf6" text-anchor="start">Remember</text><text x="202.0" y="934" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#93a0b8" text-anchor="start">which tool calls returned data, for next time</text><path d="M400,949 L400,994" stroke="#6b7894" stroke-width="1.6" fill="none" marker-end="url(#ah)"/><rect x="306.6" y="994" width="186.8" height="28" rx="14" fill="#C925D1" opacity="0.92"/><text x="400.0" y="1012.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Finding ready for review</text><text x="32" y="1060" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#66728a" text-anchor="start">The last step (MAX_STEPS, the token budget or the time reserve) is told to report from the evidence it has. If the model is unavailable, the fallback model runs.</text></svg>
